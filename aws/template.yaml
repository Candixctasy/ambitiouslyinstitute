AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Ambitiously Institute + By BoBo A List — C-Ai and data backend (ca-central-1)

# Deploy: sam build && sam deploy --guided --region ca-central-1

Globals:
  Function:
    Runtime: nodejs20.x
    Architectures: [arm64]
    Timeout: 60
    MemorySize: 512
    Environment:
      Variables:
        ALLOWED_ORIGIN: !Ref AllowedOrigin

Parameters:
  AllowedOrigin:
    Type: String
    Default: "https://www.ambitiouslybybobo.com"
  BedrockRegion:
    Type: String
    Default: "us-east-1"
    Description: "AWS region for Bedrock cross-region inference (Claude runs here)"
  BedrockModelId:
    Type: String
    Default: "us.anthropic.claude-3-5-sonnet-20241022-v2:0"
    Description: "Bedrock model ID — use us. prefix for cross-region inference"

# ── API Gateway ───────────────────────────────────────────────────────────────

Resources:
  AmbitiouslyApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: ambitiously-api
      StageName: prod
      Auth:
        ApiKeyRequired: true
        UsagePlan:
          CreateUsagePlan: PER_API
          UsagePlanName: ambitiously-usage-plan
      Cors:
        AllowMethods: "'POST,GET,OPTIONS'"
        AllowHeaders: "'Content-Type,x-api-key'"
        AllowOrigin: !Sub "'${AllowedOrigin}'"

# ── C-Ai Lambda ───────────────────────────────────────────────────────────────

  CAiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ambitiously-cai
      Handler: cai-handler.handler
      CodeUri: lambda/
      Description: C-Ai — skin intelligence + Institute assistant (Bedrock + Rekognition)
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          BEDROCK_REGION: !Ref BedrockRegion
          PHOTO_BUCKET: !Ref SkinPhotosBucket
      Policies:
        - Statement:
          - Effect: Allow
            Action:
              - bedrock:InvokeModel
            Resource:
              - !Sub "arn:aws:bedrock:${BedrockRegion}::foundation-model/*"
        - Statement:
          - Effect: Allow
            Action:
              - rekognition:DetectFaces
            Resource: "*"
        - S3ReadPolicy:
            BucketName: !Ref SkinPhotosBucket
      Events:
        # Institute routes
        Ask:
          Type: Api
          Properties:
            RestApiId: !Ref AmbitiouslyApi
            Path: /ask
            Method: POST
        Recommend:
          Type: Api
          Properties:
            RestApiId: !Ref AmbitiouslyApi
            Path: /recommend
            Method: POST
        ScoreScript:
          Type: Api
          Properties:
            RestApiId: !Ref AmbitiouslyApi
            Path: /score-script
            Method: POST
        # A List / By BoBo skin flow routes
        SkinIntake:
          Type: Api
          Properties:
            RestApiId: !Ref AmbitiouslyApi
            Path: /alist/skin-intake
            Method: POST
        SkinIntelligence:
          Type: Api
          Properties:
            RestApiId: !Ref AmbitiouslyApi
            Path: /alist/skin-intelligence
            Method: POST
        Ingredients:
          Type: Api
          Properties:
            RestApiId: !Ref AmbitiouslyApi
            Path: /alist/ingredients
            Method: POST
        Formulate:
          Type: Api
          Properties:
            RestApiId: !Ref AmbitiouslyApi
            Path: /alist/formulate
            Method: POST

# ── Database Lambda ───────────────────────────────────────────────────────────

  DbFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ambitiously-db
      Handler: db-handler.handler
      CodeUri: lambda/
      Description: Data API for Institute and By BoBo A List
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ContactsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref InstituteEnrollmentsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref InstituteProgressTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CurriculumTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SKIAssessmentsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AListMembersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AListProMembersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SkinTrackingTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ReferralsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EncyclopediaTable
        - S3CrudPolicy:
            BucketName: !Ref SkinPhotosBucket
      Environment:
        Variables:
          PHOTO_BUCKET: !Ref SkinPhotosBucket
          CONTACTS_TABLE: !Ref ContactsTable
          ENROLLMENTS_TABLE: !Ref InstituteEnrollmentsTable
          PROGRESS_TABLE: !Ref InstituteProgressTable
          CURRICULUM_TABLE: !Ref CurriculumTable
          PRODUCTS_TABLE: !Ref ProductsTable
          SKI_TABLE: !Ref SKIAssessmentsTable
          ALIST_TABLE: !Ref AListMembersTable
          ALIST_PRO_TABLE: !Ref AListProMembersTable
          SKIN_TRACKING_TABLE: !Ref SkinTrackingTable
          REFERRALS_TABLE: !Ref ReferralsTable
          ENCYCLOPEDIA_TABLE: !Ref EncyclopediaTable
      Events:
        InstituteEnrollments:
          Type: Api
          Properties:
            RestApiId: !Ref AmbitiouslyApi
            Path: /institute/enrollments
            Method: GET
        InstituteProgress:
          Type: Api
          Properties:
            RestApiId: !Ref AmbitiouslyApi
            Path: /institute/progress
            Method: POST
        Curriculum:
          Type: Api
          Properties:
            RestApiId: !Ref AmbitiouslyApi
            Path: /institute/curriculum/{programId}
            Method: GET
        ByBoBoProducts:
          Type: Api
          Properties:
            RestApiId: !Ref AmbitiouslyApi
            Path: /bybobo/products
            Method: GET
        SKIPost:
          Type: Api
          Properties:
            RestApiId: !Ref AmbitiouslyApi
            Path: /bybobo/ski-assessments
            Method: POST
        SKIGet:
          Type: Api
          Properties:
            RestApiId: !Ref AmbitiouslyApi
            Path: /bybobo/ski-assessments
            Method: GET
        Contacts:
          Type: Api
          Properties:
            RestApiId: !Ref AmbitiouslyApi
            Path: /contacts
            Method: POST
        Analytics:
          Type: Api
          Properties:
            RestApiId: !Ref AmbitiouslyApi
            Path: /analytics
            Method: POST
        # A List membership routes
        AListJoin:
          Type: Api
          Properties:
            RestApiId: !Ref AmbitiouslyApi
            Path: /alist/members
            Method: POST
        AListGet:
          Type: Api
          Properties:
            RestApiId: !Ref AmbitiouslyApi
            Path: /alist/members
            Method: GET
        AListTrack:
          Type: Api
          Properties:
            RestApiId: !Ref AmbitiouslyApi
            Path: /alist/skin-tracking
            Method: POST
        AListTrackGet:
          Type: Api
          Properties:
            RestApiId: !Ref AmbitiouslyApi
            Path: /alist/skin-tracking
            Method: GET
        AListDiscount:
          Type: Api
          Properties:
            RestApiId: !Ref AmbitiouslyApi
            Path: /alist/discount
            Method: GET
        # Professional A-List routes
        AListProJoin:
          Type: Api
          Properties:
            RestApiId: !Ref AmbitiouslyApi
            Path: /alist/pro/members
            Method: POST
        AListProGet:
          Type: Api
          Properties:
            RestApiId: !Ref AmbitiouslyApi
            Path: /alist/pro/members
            Method: GET
        AListProProducts:
          Type: Api
          Properties:
            RestApiId: !Ref AmbitiouslyApi
            Path: /alist/pro/products
            Method: GET
        # Referral routes
        AListReferralPost:
          Type: Api
          Properties:
            RestApiId: !Ref AmbitiouslyApi
            Path: /alist/referrals
            Method: POST
        AListReferralGet:
          Type: Api
          Properties:
            RestApiId: !Ref AmbitiouslyApi
            Path: /alist/referrals
            Method: GET
        # Ingredient encyclopedia routes
        EncyclopediaList:
          Type: Api
          Properties:
            RestApiId: !Ref AmbitiouslyApi
            Path: /bybobo/encyclopedia
            Method: GET
        EncyclopediaGet:
          Type: Api
          Properties:
            RestApiId: !Ref AmbitiouslyApi
            Path: /bybobo/encyclopedia/{slug}
            Method: GET
        PhotoUpload:
          Type: Api
          Properties:
            RestApiId: !Ref AmbitiouslyApi
            Path: /alist/photo-upload
            Method: POST

# ── S3 Buckets ────────────────────────────────────────────────────────────────

  SkinPhotosBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "ambitiously-skin-photos-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldPhotos
            Status: Enabled
            ExpirationInDays: 730
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "Content-Type"
            AllowedMethods:
              - PUT
            AllowedOrigins:
              - !Ref AllowedOrigin
            ExposedHeaders:
              - ETag
            MaxAge: 3000

# ── DynamoDB Tables ───────────────────────────────────────────────────────────

  ContactsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ambitiously-contacts
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH

  InstituteEnrollmentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ambitiously-institute-enrollments
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: programId
          AttributeType: S
        - AttributeName: memberId
          AttributeType: S
      KeySchema:
        - AttributeName: programId
          KeyType: HASH
        - AttributeName: memberId
          KeyType: RANGE

  InstituteProgressTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ambitiously-institute-progress
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: memberId
          AttributeType: S
        - AttributeName: lessonId
          AttributeType: S
      KeySchema:
        - AttributeName: memberId
          KeyType: HASH
        - AttributeName: lessonId
          KeyType: RANGE

  CurriculumTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ambitiously-curriculum
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: programId
          AttributeType: S
      KeySchema:
        - AttributeName: programId
          KeyType: HASH

  ProductsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ambitiously-bybobo-products
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: productId
          AttributeType: S
        - AttributeName: category
          AttributeType: S
      KeySchema:
        - AttributeName: productId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: category-index
          KeySchema:
            - AttributeName: category
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  SKIAssessmentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ambitiously-ski-assessments
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
        - AttributeName: submittedAt
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH
        - AttributeName: submittedAt
          KeyType: RANGE

  AListMembersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ambitiously-alist-members
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH

  AListProMembersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ambitiously-alist-pro-members
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH

  SkinTrackingTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ambitiously-skin-tracking
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
        - AttributeName: trackedAt
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH
        - AttributeName: trackedAt
          KeyType: RANGE

  ReferralsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ambitiously-referrals
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: referrerEmail
          AttributeType: S
        - AttributeName: referredEmail
          AttributeType: S
      KeySchema:
        - AttributeName: referrerEmail
          KeyType: HASH
        - AttributeName: referredEmail
          KeyType: RANGE

  EncyclopediaTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ambitiously-ingredient-encyclopedia
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: slug
          AttributeType: S
        - AttributeName: category
          AttributeType: S
        - AttributeName: isPublished
          AttributeType: S
      KeySchema:
        - AttributeName: slug
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: category-index
          KeySchema:
            - AttributeName: category
              KeyType: HASH
            - AttributeName: slug
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: published-index
          KeySchema:
            - AttributeName: isPublished
              KeyType: HASH
            - AttributeName: category
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

# ── Outputs ───────────────────────────────────────────────────────────────────

Outputs:
  ApiUrl:
    Description: API Gateway base URL — paste into Wix Secrets as CAI_API_URL and DB_API_URL
    Value: !Sub "https://${AmbitiouslyApi}.execute-api.ca-central-1.amazonaws.com/prod"
  SkinPhotosBucket:
    Description: S3 bucket for skin analysis photos — private, SSE-AES256, 730-day lifecycle
    Value: !Ref SkinPhotosBucket
  BedrockModelId:
    Description: Bedrock model in use for C-Ai
    Value: !Ref BedrockModelId
